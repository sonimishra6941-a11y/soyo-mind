<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#111;--muted:#666;--accent:#7c5cff;--border:#e5e5e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0}
.brand{font-weight:900;font-size:22px} .brand span{background:var(--accent);color:#fff;padding:2px 10px;border-radius:10px}
.mid{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
.chat{height:68vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px}
.msg{padding:12px 14px;border-radius:14px;max-width:85%;line-height:1.5;white-space:pre-wrap}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.bot{background:var(--bg);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.input-area{display:flex;gap:8px;margin-top:14px}
.input-area input{flex:1;padding:14px;border-radius:12px;border:1px solid var(--border);outline:none;font-size:16px}
.btn{padding:14px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
